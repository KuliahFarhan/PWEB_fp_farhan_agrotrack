<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Lupa Sandi</title>
    <link href="../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <main class="auth-reset">
      <section class="auth-panel auth-panel-reset" aria-label="Form reset sandi AgroTrack">
        <a class="auth-brand" href="../index.html" aria-label="Kembali ke landing AgroTrack">
          <img src="../assets/image/logo/logo_agrotrack.png" alt="Logo AgroTrack" />
          <span>AgroTrack</span>
        </a>

        <div class="auth-copy">
          <h1>Reset Kata Sandi</h1>
          <p>Kami akan mengirim kode ke email untuk mereset sandi akun AgroTrack kamu.</p>
        </div>

        <form id="forgotForm" class="vstack gap-3">
          <div>
            <label class="form-label" for="resetEmail">Alamat Email</label>
            <div class="auth-inline">
              <input class="form-control" id="resetEmail" name="email" type="email" placeholder="Masukkan email" required />
              <button class="btn auth-code-btn" type="button" data-demo-action="Kode reset demo terkirim.">Kirim Kode</button>
            </div>
          </div>

          <div class="auth-divider"></div>

          <div>
            <label class="form-label" for="resetCode">Masukkan Kode</label>
            <input class="form-control" id="resetCode" name="code" inputmode="numeric" placeholder="Masukkan kode" required />
          </div>
          <div>
            <label class="form-label" for="newPassword">Kata Sandi Baru</label>
            <input class="form-control" id="newPassword" name="password" type="password" placeholder="Masukkan kata sandi baru" required />
          </div>
          <div>
            <label class="form-label" for="confirmPassword">Konfirmasi Kata Sandi Baru</label>
            <input class="form-control" id="confirmPassword" name="confirm_password" type="password" placeholder="Masukkan ulang kata sandi baru" required />
          </div>
          <button class="btn auth-submit w-100" type="submit">Ganti Sandi</button>
        </form>

        <div class="auth-link-group">
          <a class="auth-muted-link" href="login.php">Kembali ke halaman Login?</a>
          <a class="auth-muted-link" href="../index.html"><span class="material-symbols-outlined">arrow_back</span><span>Kembali ke Landing Page</span></a>
        </div>
      </section>
    </main>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
