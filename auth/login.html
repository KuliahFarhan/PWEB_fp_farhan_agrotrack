<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Masuk</title>
    <link rel="icon" type="image/png" href="../assets/image/logo/logo_agrotrack.png" />
    <link rel="apple-touch-icon" href="../assets/image/logo/logo_agrotrack.png" />
    <link href="../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <main class="auth-split auth-split-login">
      <section class="auth-panel" aria-label="Form login AgroTrack">
        <a class="auth-brand" href="../index.html" aria-label="Kembali ke landing AgroTrack">
          <img src="../assets/image/logo/logo_agrotrack.png" alt="Logo AgroTrack" />
          <span>AgroTrack</span>
        </a>

        <div class="auth-copy">
          <h1>Login</h1>
          <p>Bergabunglah dengan komunitas petani digital dan kelola lahan dengan data yang rapi.</p>
        </div>

        <button class="auth-google" type="button" data-demo-action="Login Google masih berupa demo.">
          <span>G</span>
          Login with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form id="loginForm" class="vstack gap-3">
          <div>
            <label class="form-label" for="email">Alamat Email</label>
            <input class="form-control" id="email" name="email" type="email" value="petani@agrotrack.test" placeholder="Masukkan alamat email" required />
          </div>
          <div>
            <label class="form-label" for="password">Kata Sandi</label>
            <input class="form-control" id="password" name="password" type="password" value="12345678" placeholder="Masukkan kata sandi" required />
          </div>
          <div>
            <label class="form-label" for="role">Masuk sebagai</label>
            <select class="form-select" id="role" name="role">
              <option value="petani">Petani</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn auth-submit w-100" type="submit">Masuk</button>
        </form>

        <a class="auth-outline-link" href="register.html">Belum punya akun? Daftar disini</a>
        <a class="auth-muted-link" href="forgot-password.html">Lupa Sandi?</a>
      </section>

      <section class="auth-visual" aria-label="Petani di area tanaman">
        <img src="../assets/image/tanaman/auth-illustration.png" alt="Petani tersenyum di lahan pertanian" />
      </section>
    </main>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
