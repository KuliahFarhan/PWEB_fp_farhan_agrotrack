<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Daftar</title>
    <link rel="icon" type="image/png" href="../assets/image/logo/logo_agrotrack.png" />
    <link rel="apple-touch-icon" href="../assets/image/logo/logo_agrotrack.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" /></noscript>
    <link href="../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-body">
    <main class="auth-split auth-split-register">
      <section class="auth-visual" aria-label="Lahan pertanian">
        <img src="../assets/image/tanaman/corn-hero.png" alt="Petani di tengah lahan jagung" />
      </section>

      <section class="auth-panel" aria-label="Form register AgroTrack">
        <a class="auth-brand" href="../index.html" aria-label="Kembali ke landing AgroTrack">
          <img src="../assets/image/logo/logo_agrotrack.png" alt="Logo AgroTrack" />
          <span>AgroTrack</span>
        </a>

        <div class="auth-copy">
          <h1>Register</h1>
          <p>Bergabunglah dengan komunitas kami dan mulai pantau pertanian dengan lebih mudah.</p>
        </div>

        <button class="auth-google" type="button" data-demo-action="Register Google masih berupa demo.">
          <span>G</span>
          Login with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form id="registerForm" class="vstack gap-3">
          <div>
            <label class="form-label" for="name">Nama Lengkap</label>
            <input class="form-control" id="name" name="name" value="Budi Santoso" placeholder="Masukkan nama lengkap" required />
          </div>
          <div>
            <label class="form-label" for="phone">Nomor Handphone</label>
            <input class="form-control" id="phone" name="phone" value="081234567890" placeholder="Masukkan nomor handphone" required />
          </div>
          <div>
            <label class="form-label" for="email">Alamat Email</label>
            <input class="form-control" id="email" name="email" type="email" value="budi@agrotrack.test" placeholder="Masukkan alamat email" required />
          </div>
          <div>
            <label class="form-label" for="password">Kata Sandi</label>
            <input class="form-control" id="password" name="password" type="password" value="12345678" placeholder="Masukkan kata sandi" required />
          </div>
          <button class="btn auth-submit w-100" type="submit">Daftar</button>
        </form>

        <a class="auth-outline-link" href="login.html">Sudah punya akun? Login disini</a>
      </section>
    </main>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
