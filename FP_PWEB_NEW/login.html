          <div class="text-center">
            <h1 class="font-headline-md text-headline-md text-primary">
              Selamat Datang
            </h1>
            <p class="font-body-md text-body-md text-on-surface-variant">
              Silakan masuk ke akun AgroTrack Anda
            </p>
          </div>
        </header>
        <!-- Form Section -->
        <form class="flex flex-col gap-md" onsubmit="event.preventDefault()">
          <!-- Email Field -->
          <div class="flex flex-col gap-xs">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="email"
              >Email</label
            >
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-primary"
                >mail</span
              >
              <input
                class="w-full pl-10 pr-md py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/50 input-focus-ring transition-all"
                id="email"
                placeholder="nama@email.com"
                required=""
                type="email"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="flex flex-col gap-xs">
            <label
              class="font-label-md text-label-md text-on-surface-variant"
              for="password"
              >Password</label
            >
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-primary"
                >lock</span
              >
              <input
                class="w-full pl-10 pr-10 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/50 input-focus-ring transition-all"
                id="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
              <button
                class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors"
                onclick="togglePassword()"
                type="button"
              >
                <span
                  class="material-symbols-outlined text-[20px]"
                  id="password-toggle-icon"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-sm cursor-pointer group">
              <div class="relative flex items-center">
                <input
                  class="peer h-5 w-5 border-outline-variant text-primary rounded focus:ring-primary/20 transition-all cursor-pointer"
                  id="remember"
                  type="checkbox"
                />
              </div>
              <span
                class="font-body-sm text-body-sm text-on-surface-variant select-none group-hover:text-on-surface"
                >Ingat Saya</span
              >
            </label>
            <a
              class="font-label-md text-label-md text-primary hover:underline transition-all"
              href="#"
              >Lupa Password?</a
            >
          </div>
          <!-- Primary CTA -->
          <button
            class="mt-md w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-3 rounded-lg hover:bg-primary-container transition-all active:scale-[0.98] shadow-sm"
            type="submit"
          >
            Masuk
          </button>
        </form>
        <!-- Divider -->
        <div class="flex items-center gap-md">
          <div class="h-[1px] flex-1 bg-outline-variant"></div>
          <span class="font-label-md text-label-md text-outline">ATAU</span>
          <div class="h-[1px] flex-1 bg-outline-variant"></div>
        </div>
        <!-- Footer Links -->
        <footer class="flex flex-col items-center gap-sm">
          <p class="font-body-sm text-body-sm text-on-surface-variant">
            Belum punya akun?
            <a
              class="font-label-md text-label-md text-primary font-semibold hover:underline"
              href="#"
              >Daftar Akun Baru</a
            >
          </p>
        </footer>
      </div>
      <!-- Trust Badges / Support Info -->
      <div class="mt-xl flex justify-center gap-lg opacity-60">
        <div class="flex items-center gap-xs">
          <span class="material-symbols-outlined text-[18px]"
            >verified_user</span
          >
          <span class="font-label-md text-label-md">Data Terenkripsi</span>
        </div>
        <div class="flex items-center gap-xs">
          <span class="material-symbols-outlined text-[18px]"
            >support_agent</span
          >
          <span class="font-label-md text-label-md">Bantuan 24/7</span>
        </div>
      </div>
    </main>
    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("password-toggle-icon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.textContent = "visibility_off";
        } else {
          passwordInput.type = "password";
          toggleIcon.textContent = "visibility";
        }
      }

      // Add some micro-interactions for input focus
      document.querySelectorAll("input").forEach((input) => {
        input.addEventListener("focus", () => {
          input.parentElement.classList.add("scale-[1.01]");
        });
        input.addEventListener("blur", () => {
          input.parentElement.classList.remove("scale-[1.01]");
        });
      });
    </script>
  </body>
</html>
