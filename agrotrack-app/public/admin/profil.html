<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Admin | AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img
            src="../assets/logo/logo-agrotrack.png"
            class="h-11 w-11 rounded-full bg-white p-1"
            alt="AgroTrack"
          />
          <b>AgroTrack</b>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="users.html">Data Pengguna</a>
          <a href="tanaman.html">Data Tanaman</a>
          <a href="monitoring-lahan.html">Monitoring Lahan</a>
          <a href="laporan.html">Laporan</a>
          <a class="active" href="profil.html">Profil Admin</a>
          <a href="../login.html">Logout</a>
        </nav>
      </aside>
      <main class="app-main">
        <header class="topbar">
          <p class="text-xs font-bold uppercase tracking-[.24em] text-teal-700">
            Area Admin
          </p>
          <h1 class="text-2xl font-black">Profil Admin</h1>
        </header>
        <section class="grid gap-6 p-5 lg:grid-cols-[320px_1fr] lg:p-8">
          <aside class="agro-card rounded-lg p-5 text-center">
            <img
              src="../assets/logo/logo-agrotrack.png"
              class="mx-auto h-32 w-32 rounded-full bg-teal-950 object-contain p-5"
              alt="Admin"
            />
            <h2 class="mt-4 text-xl font-black">Admin AgroTrack</h2>
            <p class="text-sm text-slate-500">admin@agrotrack.test</p>
          </aside>
          <form class="agro-card form-grid rounded-lg p-5 md:grid-cols-2">
            <label>
              Nama Lengkap
              <input placeholder="Admin AgroTrack" />
            </label>
            <label>
              Email
              <input type="email" placeholder="admin@agrotrack.test" />
            </label>
            <label>
              Nomor HP
              <input placeholder="08xxxxxxxxxx" />
            </label>
            <label>
              Status
              <input placeholder="aktif" />
            </label>
            <label>
              Password Lama
              <input type="password" />
            </label>
            <label>
              Password Baru
              <input type="password" />
            </label>
            <button class="btn-primary md:col-span-2" type="button">
              Simpan Profil Demo
            </button>
          </form>
        </section>
      </main>
    </div>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
