<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-5 py-14">
      <form
        class="agro-card form-grid w-full rounded-lg p-8"
        action="#"
        method="post"
      >
        <a href="index.html" class="font-black text-teal-950">AgroTrack</a>
        <p class="text-sm font-bold uppercase tracking-[.24em] text-teal-700">
          Forgot Password
        </p>
        <h1 class="text-3xl font-black text-slate-950">
          Reset password sederhana.
        </h1>
        <p class="text-sm text-slate-500">
          Pengecekan email dan hashing password akan dibuat setelah backend
          siap.
        </p>
        <label>
          Alamat Email
          <input type="email" name="email" placeholder="email yang terdaftar" />
        </label>
        <label>
          Password Baru
          <input
            type="password"
            name="password"
            placeholder="Minimal 8 karakter"
          />
        </label>
        <label>
          Konfirmasi Password Baru
          <input
            type="password"
            name="password_confirmation"
            placeholder="Ulangi password baru"
          />
        </label>
        <button class="btn-primary" type="button">Simpan Password Demo</button>
        <a class="text-center font-bold text-teal-700" href="login.html">
          Kembali ke login
        </a>
      </form>
    </main>
    <script src="assets/js/app.js"></script>
  </body>
</html>
