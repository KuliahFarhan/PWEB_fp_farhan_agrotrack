<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="w-96 h-64 relative rounded-[5px] border border-purple-500 overflow-hidden"
    >
      <div
        class="w-96 p-2.5 left-[20px] top-[20px] absolute inline-flex flex-col justify-start items-start gap-2.5"
      >
        <div
          class="self-stretch px-3 py-2.5 bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 flex flex-col justify-start items-start overflow-hidden"
        >
          <div
            class="self-stretch flex flex-col justify-start items-start overflow-hidden"
          >
            <div
              class="self-stretch justify-center text-color-azure-65 text-base font-normal font-['Inter']"
            >
              Masukkan kata sandi
            </div>
          </div>
        </div>
      </div>
      <div
        class="w-96 p-2.5 left-[20px] top-[101px] absolute inline-flex flex-col justify-start items-start gap-2.5"
      >
        <div
          class="self-stretch h-10 px-3 py-2.5 bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 flex flex-col justify-start items-start overflow-hidden"
        >
          <div
            data-property-1="Default"
            class="w-4 h-6 p-2.5 flex flex-col justify-center items-center gap-2.5"
          >
            <div
              class="self-stretch justify-center text-black text-base font-normal font-['Inter']"
            >
              |
            </div>
          </div>
        </div>
      </div>
      <div
        class="w-96 p-2.5 left-[20px] top-[182px] absolute inline-flex flex-col justify-start items-start gap-2.5"
      >
        <div
          class="self-stretch h-10 px-3 py-2.5 bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 flex flex-col justify-start items-start overflow-hidden"
        >
          <div
            class="self-stretch justify-center text-color-azure-65 text-base font-normal font-['Inter']"
          >
            *************
          </div>
          <div
            data-property-1="Default"
            class="w-4 h-6 p-2.5 flex flex-col justify-center items-center gap-2.5"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
