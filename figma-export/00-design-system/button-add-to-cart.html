<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="w-96 h-44 relative rounded-[5px] border border-purple-500 overflow-hidden"
    >
      <div
        class="w-96 p-2.5 left-[20px] top-[20px] absolute inline-flex flex-col justify-start items-start gap-2.5"
      >
        <div
          class="self-stretch h-10 px-8 bg-blue-500 rounded-sm flex flex-col justify-start items-center gap-2.5 overflow-hidden"
        >
          <div
            class="size- inline-flex justify-start items-center gap-2 overflow-hidden"
          >
            <div class="size-4 relative">
              <div class="size-3.5 left-0 top-[0.67px] absolute bg-white"></div>
            </div>
            <div
              class="text-center justify-center text-white text-base font-bold font-['Lato'] leading-10 tracking-wide"
            >
              Add to cart
            </div>
          </div>
        </div>
      </div>
      <div
        class="w-96 p-2.5 left-[20px] top-[101px] absolute inline-flex flex-col justify-start items-start gap-2.5"
      >
        <div
          class="self-stretch h-10 px-8 bg-blue-900 rounded-sm flex flex-col justify-start items-center gap-2.5 overflow-hidden"
        >
          <div
            class="size- inline-flex justify-start items-center gap-2 overflow-hidden"
          >
            <div class="size-4 relative">
              <div
                class="size-3.5 left-0 top-[0.67px] absolute bg-stone-400"
              ></div>
            </div>
            <div
              class="text-center justify-center text-stone-400 text-base font-bold font-['Lato'] leading-10 tracking-wide"
            >
              Add to cart
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
