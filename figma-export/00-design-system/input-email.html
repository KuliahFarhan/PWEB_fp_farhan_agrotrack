<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="w-96 h-52 relative rounded-[5px] border border-purple-500 overflow-hidden"

      <div
        class="w-96 px-3 py-2.5 left-[20px] top-[20px] absolute bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 inline-flex flex-col justify-start items-start overflow-hidden"
      >
        <div
          class="self-stretch flex flex-col justify-start items-start overflow-hidden"
        >
          <div
            class="self-stretch justify-center text-color-azure-65 text-base font-normal font-['Inter']"
          >
            Masukkan alamat email
          </div>
        </div>
      </div>
      <div
        class="w-96 px-3 py-2.5 left-[20px] top-[142px] absolute bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 inline-flex flex-col justify-start items-start overflow-hidden"
      >
        <div
          class="self-stretch flex flex-col justify-start items-start overflow-hidden"
        >
          <div
            class="self-stretch justify-center text-color-azure-65 text-base font-normal font-['Inter']"
          >
            duta@gmail.com
          </div>
        </div>
      </div>
      <div
        class="w-96 h-10 px-3 py-2.5 left-[20px] top-[81px] absolute bg-color-white-solid rounded-lg outline outline-1 outline-offset-[-1px] outline-color-grey-91 inline-flex flex-col justify-start items-start overflow-hidden"
      >
        <div
          data-property-1="Default"
          class="w-3 h-4 p-2.5 flex flex-col justify-center items-center gap-2.5"
        >
          <div
            class="self-stretch justify-center text-black text-base font-normal font-['Inter']"
          >
            |
          </div>
        </div>
      </div>
    </div>

</html>
