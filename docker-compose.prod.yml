services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-agrotrack}
      DB_USERNAME: ${DB_USERNAME:-agrotrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      AGROTRACK_DB_HOST: ${DB_HOST:-mysql}
      AGROTRACK_DB_PORT: ${DB_PORT:-3306}
      AGROTRACK_DB_NAME: ${DB_DATABASE:-agrotrack}
      AGROTRACK_DB_USER: ${DB_USERNAME:-agrotrack_user}
      AGROTRACK_DB_PASS: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agrotrack

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agrotrack}
      MYSQL_USER: ${DB_USERNAME:-agrotrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_STRONG_ROOT_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-CHANGE_ME_STRONG_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agrotrack

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agrotrack

volumes:
  mysql_data:

networks:
  agrotrack:
    driver: bridge
