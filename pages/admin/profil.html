<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Profil Admin</title>
    <link href="../../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body data-portal="admin" data-active="profil" data-base="../../">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="admin-topbar d-flex align-items-center justify-content-between gap-3">
        <div class="admin-search">
          <span class="material-symbols-outlined">search</span>
          <input class="form-control" placeholder="Cari pengaturan profil admin..." />
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="icon-button" type="button" aria-label="Notifikasi"><span class="material-symbols-outlined">notifications</span></button>
          <button class="icon-button" type="button" aria-label="Pengaturan"><span class="material-symbols-outlined">settings</span></button>
          <img class="user-avatar" src="../../assets/image/profil/foto_profil_6.jpg" alt="Foto Admin" />
          <button class="btn btn-outline-primary d-lg-none" data-sidebar-toggle type="button"><span class="material-symbols-outlined">menu</span></button>
        </div>
      </div>

      <div class="topbar">
        <div>
          <h1 class="page-title">Profil Admin</h1>
          <p class="page-kicker">Edit informasi administrator. Email dibuat readonly supaya identitas login tidak berubah sembarang.</p>
        </div>
      </div>

      <section class="profile-layout">
        <div class="panel profile-panel">
          <form data-profile-form class="vstack gap-4">
            <section id="basic">
              <h2 class="section-title">Basic Information</h2>
              <div class="profile-photo-editor">
                <img id="adminAvatarPreview" src="../../assets/image/profil/foto_profil_6.jpg" alt="Foto profil admin" />
                <label class="btn btn-sm btn-light">
                  Choose File
                  <input class="visually-hidden" type="file" accept="image/*" data-avatar-input="#adminAvatarPreview" />
                </label>
              </div>
              <div class="row g-3 mt-2">
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="adminName">Nama</label>
                  <div class="input-icon"><span class="material-symbols-outlined">person</span><input class="form-control" id="adminName" value="Admin Root" /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="adminPhone">Nomor Handphone</label>
                  <div class="input-icon"><span class="material-symbols-outlined">call</span><input class="form-control" id="adminPhone" value="081298765432" /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="adminEmail">Email</label>
                  <div class="input-icon"><span class="material-symbols-outlined">mail</span><input class="form-control" id="adminEmail" type="email" value="admin@agrotrack.test" readonly /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="adminDivision">Divisi</label>
                  <div class="input-icon"><span class="material-symbols-outlined">corporate_fare</span><input class="form-control" id="adminDivision" value="Operasional Platform" /></div>
                </div>
              </div>
              <button class="btn btn-primary mt-3" type="submit">Update Profil</button>
            </section>

            <section id="access">
              <h2 class="section-title">Hak Akses</h2>
              <div class="row g-3">
                <div class="col-md-4"><label class="form-check profile-check"><input class="form-check-input" type="checkbox" checked /> Kelola pengguna</label></div>
                <div class="col-md-4"><label class="form-check profile-check"><input class="form-check-input" type="checkbox" checked /> Generate laporan</label></div>
                <div class="col-md-4"><label class="form-check profile-check"><input class="form-check-input" type="checkbox" checked /> Monitoring lahan</label></div>
              </div>
            </section>

            <section id="password">
              <h2 class="section-title">Update Password</h2>
              <div class="row g-3">
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">lock</span><input class="form-control" type="password" placeholder="Current Password" /></div></div>
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">lock_reset</span><input class="form-control" type="password" placeholder="New Password" /></div></div>
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">verified_user</span><input class="form-control" type="password" placeholder="Confirm Password" /></div></div>
              </div>
              <button class="btn btn-primary mt-3" type="submit">Update Password</button>
            </section>
          </form>
        </div>
      </section>
    </main>
    <script src="../../assets/js/app.js"></script>
  </body>
</html>
