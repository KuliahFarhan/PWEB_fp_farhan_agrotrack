<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Peta Lahan</title>
    <link rel="icon" type="image/png" href="../../assets/image/logo/logo_agrotrack.png" />
    <link rel="apple-touch-icon" href="../../assets/image/logo/logo_agrotrack.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="../../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
    <link href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" rel="stylesheet" />
    <link href="../../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body data-portal="petani" data-active="peta" data-base="../../">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="topbar">
        <div>
          <h1 class="page-title">Peta Lahan</h1>
          <p class="page-kicker">Gambar batas lahan, hitung luas otomatis, lalu simpan koordinat polygon.</p>
        </div>
        <button class="btn btn-outline-primary d-lg-none" data-sidebar-toggle type="button"><span class="material-symbols-outlined">menu</span></button>
      </div>

      <section class="row g-3">
        <div class="col-xl-8">
          <div class="panel p-0 overflow-hidden">
            <div id="fieldMap" class="leaflet-map" aria-label="Peta interaktif untuk menggambar batas lahan"></div>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="panel mb-3">
            <h2 class="section-title">Kontrol Polygon</h2>
            <div class="vstack gap-3">
              <div>
                <label class="form-label fw-semibold" for="lahanSelect">Pilih Lahan</label>
                <select class="form-select" id="lahanSelect">
                  <option value="">Memuat data lahan...</option>
                </select>
              </div>
              <div class="map-action-grid">
                <button class="btn btn-primary" id="savePolygonBtn" type="button" disabled>
                  <span class="material-symbols-outlined">save</span>
                  Simpan Polygon
                </button>
                <button class="btn btn-outline-primary" id="resetPolygonBtn" type="button">
                  <span class="material-symbols-outlined">restart_alt</span>
                  Reset Polygon
                </button>
              </div>
              <p class="small text-secondary mb-0" id="mapHint">
                Pilih tool polygon di kiri peta, klik beberapa titik mengikuti batas lahan, lalu tutup polygon.
              </p>
            </div>
          </div>
        </div>

        <div class="col-xl-8">
          <div class="panel">
            <h2 class="section-title">Koordinat Polygon</h2>
            <pre class="polygon-preview" id="polygonPreview">Belum ada polygon.</pre>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="row g-3">
            <div class="col-sm-6 col-xl-12">
              <div class="stat-card map-metric">
                <div class="stat-label">Luas Polygon</div>
                <div class="stat-value" id="areaMeter">0,00 m&sup2;</div>
                <div class="stat-note" id="areaHectare">0,0000 ha</div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-12">
              <div class="stat-card map-metric">
                <div class="stat-label">Titik Tengah</div>
                <div class="map-coordinate">
                  <span>Lat</span>
                  <strong id="centerLat">-</strong>
                </div>
                <div class="map-coordinate">
                  <span>Lng</span>
                  <strong id="centerLng">-</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/peta-lahan.js"></script>
  </body>
</html>
