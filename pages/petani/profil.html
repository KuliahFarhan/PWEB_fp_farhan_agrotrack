<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroTrack - Profil Petani</title>
    <link rel="icon" type="image/png" href="../../assets/image/logo/logo_agrotrack.png" />
    <link rel="apple-touch-icon" href="../../assets/image/logo/logo_agrotrack.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="../../assets/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body data-portal="petani" data-active="profil" data-base="../../">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="topbar">
        <div>
          <h1 class="page-title">Profil Petani</h1>
          <p class="page-kicker">Kelola identitas akun dan preferensi lahan. Email tidak bisa diubah.</p>
        </div>
        <button class="btn btn-outline-primary d-lg-none" data-sidebar-toggle type="button"><span class="material-symbols-outlined">menu</span></button>
      </div>

      <section class="profile-layout">
        <div class="panel profile-panel">
          <form data-profile-form class="vstack gap-4">
            <section id="basic">
              <h2 class="section-title">Basic Information</h2>
              <div class="profile-photo-editor">
                <img id="petaniAvatarPreview" src="../../assets/image/profil/farmer-profile.jpg" alt="Foto profil petani" />
                <label class="btn btn-sm btn-light">
                  Choose File
                  <input class="visually-hidden" type="file" accept="image/*" data-avatar-input="#petaniAvatarPreview" />
                </label>
              </div>
              <div class="row g-3 mt-2">
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="petaniName">Nama</label>
                  <div class="input-icon"><span class="material-symbols-outlined">person</span><input class="form-control" id="petaniName" value="Pak Budi Santoso" /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="petaniPhone">Nomor Handphone</label>
                  <div class="input-icon"><span class="material-symbols-outlined">call</span><input class="form-control" id="petaniPhone" value="081234567890" /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="petaniEmail">Email</label>
                  <div class="input-icon"><span class="material-symbols-outlined">mail</span><input class="form-control" id="petaniEmail" type="email" value="petani@agrotrack.test" readonly /></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="petaniLocation">Lokasi Utama</label>
                  <div class="input-icon"><span class="material-symbols-outlined">location_on</span><input class="form-control" id="petaniLocation" value="Sidoarjo, Jawa Timur" /></div>
                </div>
              </div>
            </section>

            <section id="farm">
              <h2 class="section-title">Preferensi Pertanian</h2>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label fw-semibold" for="mainCrop">Komoditas Utama</label>
                  <select class="form-select" id="mainCrop">
                    <option>Padi</option>
                    <option>Jagung</option>
                    <option>Kedelai</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold" for="farmArea">Total Lahan</label>
                  <input class="form-control" id="farmArea" value="12.8 Ha" />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold" for="farmerStatus">Status</label>
                  <select class="form-select" id="farmerStatus">
                    <option>Petani Aktif</option>
                    <option>Kelompok Tani</option>
                  </select>
                </div>
              </div>
              <button class="btn btn-primary mt-3" type="submit">Update Profil</button>
            </section>

            <section id="password">
              <h2 class="section-title">Update Password</h2>
              <div class="row g-3">
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">lock</span><input class="form-control" type="password" placeholder="Current Password" /></div></div>
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">lock_reset</span><input class="form-control" type="password" placeholder="New Password" /></div></div>
                <div class="col-md-4"><div class="input-icon"><span class="material-symbols-outlined">verified_user</span><input class="form-control" type="password" placeholder="Confirm Password" /></div></div>
              </div>
              <button class="btn btn-primary mt-3" type="submit">Update Password</button>
            </section>
          </form>
        </div>
      </section>
    </main>
    <script src="../../assets/js/app.js"></script>
  </body>
</html>
