<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(app|config|database|docs)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "\.(env|md|sql|log|lock|yml|yaml|json)$">
    Require all denied
</FilesMatch>
