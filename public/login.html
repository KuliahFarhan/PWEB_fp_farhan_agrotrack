<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <main class="grid min-h-screen bg-white lg:grid-cols-[.9fr_1.1fr]">
      <section
        class="flex items-center bg-teal-950 px-6 py-12 text-white lg:px-16"
      >
        <div class="w-full max-w-md">
          <a href="index.html" class="flex items-center gap-3 font-black">
            <img
              src="assets/logo/logo-agrotrack.png"
              class="h-11 w-11 rounded-full bg-white p-1"
              alt="AgroTrack"
            />
            AgroTrack
          </a>
          <p
            class="mt-10 text-sm font-bold uppercase tracking-[.24em] text-yellow-200"
          >
            Login AgroTrack
          </p>
          <h1 class="mt-4 text-3xl font-black">
            Masuk ke dashboard petani atau admin.
          </h1>
          <p class="placeholder-note mt-5">
            UI login statis. Autentikasi, session, dan redirect role belum
            diimplementasikan.
          </p>
          <div data-auth-message class="mt-5"></div>
          <form
            class="mt-6 grid gap-4"
            action="../app/auth/login.php"
            method="post"
          >
            <label class="grid gap-2">
              <span class="font-semibold">Alamat Email</span>
              <input
                class="rounded-md px-4 py-3 text-slate-900"
                type="email"
                name="email"
                placeholder="admin@agrotrack.test"
              />
            </label>
            <label class="grid gap-2">
              <span class="font-semibold">Kata Sandi</span>
              <input
                class="rounded-md px-4 py-3 text-slate-900"
                type="password"
                name="password"
                placeholder="password"
              />
            </label>
            <div class="flex justify-between text-sm">
              <label>
                <input type="checkbox" />
                Remember me
              </label>
              <a class="font-bold text-yellow-200" href="forgot-password.html">
                Lupa sandi?
              </a>
            </div>
            <button
              class="rounded-md bg-blue-600 px-5 py-3 font-bold text-white"
              type="submit"
            >
              Masuk
            </button>
            <div class="grid gap-2 sm:grid-cols-2">
              <a class="btn-secondary" href="petani/dashboard.html">
                Demo Petani
              </a>
              <a class="btn-secondary" href="admin/dashboard.html">
                Demo Admin
              </a>
            </div>
          </form>
          <p class="mt-6 text-sm">
            Belum punya akun?
            <a class="font-bold text-yellow-200" href="register.html">
              Daftar petani
            </a>
          </p>
        </div>
      </section>
      <section
        class="hidden bg-cover bg-center lg:block"
        style="
          background-image:
            linear-gradient(rgba(4, 47, 46, 0.25), rgba(4, 47, 46, 0.25)),
            url(&quot;assets/images/auth-illustration.png&quot;);
        "
      ></section>
    </main>
    <script src="assets/js/app.js"></script>
  </body>
</html>
