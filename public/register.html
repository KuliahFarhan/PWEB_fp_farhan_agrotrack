<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AgroTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <main class="page-section grid gap-10 lg:grid-cols-[.9fr_1.1fr]">
      <section class="rounded-lg bg-teal-950 p-8 text-white">
        <a href="index.html" class="font-black">AgroTrack</a>
        <p
          class="mt-10 text-sm font-bold uppercase tracking-[.24em] text-yellow-200"
        >
          Register Petani
        </p>
        <h1 class="mt-4 text-3xl font-black">
          Buat akun petani untuk mulai mencatat lahan.
        </h1>
        <p class="mt-4 text-slate-200">
          Role akun baru nantinya otomatis menjadi petani. Form ini masih
          skeleton UI.
        </p>
        <img
          src="assets/images/corn-hero.png"
          class="mt-8 h-52 w-full rounded-lg object-cover"
          alt="Jagung"
        />
      </section>
      <form class="agro-card form-grid rounded-lg p-6" action="#" method="post">
        <p class="placeholder-note">
          Placeholder validasi: email unik, password minimal 8 karakter, dan
          konfirmasi cocok.
        </p>
        <label>
          Nama Lengkap
          <input name="nama" placeholder="Masukkan nama lengkap" />
        </label>
        <label>
          Alamat Email
          <input
            type="email"
            name="email"
            placeholder="petani@agrotrack.test"
          />
        </label>
        <label>
          Nomor HP
          <input type="tel" name="nomor_hp" placeholder="08xxxxxxxxxx" />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            placeholder="Minimal 8 karakter"
          />
        </label>
        <label>
          Konfirmasi Password
          <input
            type="password"
            name="password_confirmation"
            placeholder="Ulangi password"
          />
        </label>
        <button class="btn-primary" type="button">Daftar Akun Demo</button>
        <a class="text-center font-bold text-teal-700" href="login.html">
          Sudah punya akun? Login
        </a>
      </form>
    </main>
    <script src="assets/js/app.js"></script>
  </body>
</html>
